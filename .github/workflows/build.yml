name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    name: Watch app (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build
        working-directory: watch
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect
        run: cp watch/app/build/outputs/apk/release/app-release.apk WristMouse-watch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: watch-apk
          path: WristMouse-watch.apk

  windows:
    name: Windows app (.exe)
    needs: watch
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: watch-apk
          path: pc/bundle
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        run: python -m pytest -q tests
      - name: Package
        run: >
          pyinstaller --noconfirm --clean --windowed --name WristMouse
          --add-data "bundle/WristMouse-watch.apk;bundle"
          --collect-all faster_whisper --collect-all ctranslate2 --collect-all bleak
          --collect-all winrt --collect-submodules winrt
          run.py
      - name: Self-test the packaged app (incl. speech model)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\WristMouse\WristMouse.exe" -ArgumentList "--selftest","tiny.en" -Wait -PassThru
          Get-Content "$env:APPDATA\WristMouse\log.txt"
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item ..\README.md dist\WristMouse\README.md
          Compress-Archive -Path dist\WristMouse -DestinationPath ..\WristMouse-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: WristMouse-Windows.zip

  release:
    name: Publish release
    needs: [watch, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: WristMouse 1.0.${{ github.run_number }}
          make_latest: "true"
          body: |
            **Laptop:** download `WristMouse-Windows.zip`, unzip it, run `WristMouse.exe`.
            **Watch:** installed from inside the laptop app (Install on watch tab). You don't need to download the .apk yourself.
          files: |
            WristMouse-Windows.zip
            WristMouse-watch.apk
